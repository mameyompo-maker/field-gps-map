<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="description" content="Registo GPS de pontos, áreas e percursos no campo — funciona sem rede e partilha com a equipa.">
<title>Field GPS Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>

<!-- Ícones (SVG próprios — os emojis mudam de tamanho de aparelho para aparelho) -->
<svg id="iconDefs" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path fill="currentColor" d="M5 11h14v2H5z"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path fill="currentColor" d="M12 16.5 4.6 10.8 3 12l9 7 9-7-1.6-1.2zM12 14l9-7-9-7-9 7z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></symbol>
  <symbol id="i-polygon" viewBox="0 0 24 24"><path fill="currentColor" d="M5 4h5l9 3v9l-6 4H6l-3-8zm1.4 2L5 12.2 7.3 18h5.1l4.6-3V8.4L9.7 6z"/><circle cx="5" cy="4" r="2" fill="currentColor"/><circle cx="19" cy="7" r="2" fill="currentColor"/><circle cx="13" cy="20" r="2" fill="currentColor"/><circle cx="3" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M3 19c3-1 4-6 8-7s5-6 10-8"/><circle cx="3" cy="19" r="2" fill="currentColor"/><circle cx="21" cy="4" r="2" fill="currentColor"/></symbol>
  <symbol id="i-point" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2a5.1 5.1 0 0 1-4.4-2.4l-1-1.6a2 2 0 0 0-2.5-.8L6 8.3V13h2V9.6z"/></symbol>
  <symbol id="i-corner" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M4 20V5h15"/><circle cx="4" cy="5" r="3" fill="currentColor"/></symbol>
  <symbol id="i-tap" viewBox="0 0 24 24"><path fill="currentColor" d="M9 11.2V7.5a1.5 1.5 0 0 1 3 0v6.1l3.6 1a2 2 0 0 1 1.4 2.3L16 22H8.5l-3.7-5.3a1.3 1.3 0 0 1 2-1.6L9 17zM10.5 2a5.5 5.5 0 0 1 4.4 8.8l-1.2-.9A4 4 0 1 0 7 7.5c0 .9.3 1.7.8 2.4l-1.2.9A5.5 5.5 0 0 1 10.5 2z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path fill="currentColor" d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM4 18h16v2H4z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path fill="currentColor" d="M11 16h2V6.8l3.3 3.3 1.4-1.4L12 3 6.3 8.7l1.4 1.4L11 6.8zM4 18h16v2H4z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.3-2.9a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-3.3 0-9 1.7-9 5v2h18v-2c0-3.3-5.7-5-9-5z"/></symbol>
  <symbol id="i-cloud-ok" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 10A7 7 0 0 0 6.3 8 5.5 5.5 0 0 0 6.5 19h12.7a4.5 4.5 0 0 0 .2-9zM10 17l-3.5-3.5 1.4-1.4 2.1 2.1 5.1-5.1 1.4 1.4z"/></symbol>
  <symbol id="i-cloud-off" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 10A7 7 0 0 0 9.1 4.6l1.5 1.5A5 5 0 0 1 17.5 11v.5H19a2.5 2.5 0 0 1 1.7 4.3l1.4 1.5A4.5 4.5 0 0 0 19.4 10zM3 5.3 5.8 8A5.5 5.5 0 0 0 6.5 19h11.2l2 2 1.3-1.3L4.3 4zM7.7 10l7 7H6.5a3.5 3.5 0 0 1 0-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 8c-2.7 0-5.1 1-7 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.1 16l2.3-.8A10.5 10.5 0 0 0 12.5 8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.3V21h3.8L17.8 9.9l-3.7-3.7zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7z"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 5.2 19.1 3.5A1.5 1.5 0 0 0 18 3H6a1.5 1.5 0 0 0-1.2.5L3.5 5.2A2 2 0 0 0 3 6.5V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.5a2 2 0 0 0-.5-1.3zM12 17.5 6.5 12H10v-2h4v2h3.5zM5.1 5l.8-1h12l.9 1z"/></symbol>
  <symbol id="i-gmaps" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 3 15 5.1 9 3 3.5 4.9A.5.5 0 0 0 3 5.4V20.5a.5.5 0 0 0 .7.5L9 18.9l6 2.1 5.5-1.9a.5.5 0 0 0 .5-.5V3.5a.5.5 0 0 0-.5-.5zM15 19l-6-2.1V5l6 2.1z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<!-- ============================== Ecrã de entrada ============================== -->
<section id="loginScreen" class="screen" hidden>
  <div class="screen-card">
    <img src="icon-192.png" alt="" class="app-logo" width="72" height="72">
    <h1>Field GPS Map</h1>
    <p data-i18n="login.lead"></p>
    <ul class="login-points">
      <li data-i18n="login.p1"></li>
      <li data-i18n="login.p2"></li>
      <li data-i18n="login.p3"></li>
    </ul>
    <p id="loginStatus" class="muted" aria-live="polite"></p>
    <button id="btnSignIn" class="btn-primary btn-wide" type="button" data-i18n="login.google"></button>
    <button id="btnDemo" class="btn-text btn-wide" type="button" data-i18n="login.demo"></button>
    <div class="lang-switch" role="group" aria-label="Idioma / 言語">
      <button type="button" data-lang="pt">Português</button>
      <button type="button" data-lang="ja">日本語</button>
    </div>
  </div>
</section>

<section id="deniedScreen" class="screen" hidden>
  <div class="screen-card">
    <h1 data-i18n="denied.title"></h1>
    <p id="deniedText"></p>
    <p class="muted" data-i18n="denied.how"></p>
    <button id="btnRecheck" class="btn-primary btn-wide" type="button" data-i18n="denied.recheck"></button>
    <button id="btnSignOutDenied" class="btn-text btn-wide" type="button" data-i18n="menu.signout"></button>
  </div>
</section>

<!-- ============================== Ecrã principal ============================== -->
<main id="mainScreen" hidden>
  <div id="mapGoogle" class="map-layer"></div>
  <div id="mapSimple" class="map-layer" hidden><canvas id="simpleCanvas"></canvas></div>

  <header class="topbar">
    <button id="btnMenu" class="chip-btn icon-only" type="button" data-i18n-title="menu.open"><svg class="ic"><use href="#i-menu"/></svg></button>
    <button id="btnList" class="chip-btn" type="button"><svg class="ic"><use href="#i-list"/></svg><span id="listCount">0</span></button>
    <span class="spacer"></span>
    <button id="gpsChip" class="chip gps-wait" type="button"><svg class="ic"><use href="#i-target"/></svg><span id="gpsText">GPS…</span></button>
    <button id="syncChip" class="chip" type="button" hidden><svg class="ic"><use id="syncIcon" href="#i-cloud-ok"/></svg><span id="syncText"></span></button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="map-tools">
    <button id="btnLayers" class="round-btn" type="button" data-i18n-title="map.layers"><svg class="ic"><use href="#i-layers"/></svg></button>
    <button id="btnZoomIn" class="round-btn" type="button" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button id="btnZoomOut" class="round-btn" type="button" aria-label="-"><svg class="ic"><use href="#i-minus"/></svg></button>
    <button id="btnLocate" class="round-btn" type="button" data-i18n-title="map.locate"><svg class="ic"><use href="#i-locate"/></svg></button>
  </div>

  <div id="mapModeTag" class="map-mode-tag" hidden></div>

  <button id="fabNew" class="fab" type="button"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="new.button"></span></button>

  <!-- Painel de gravação -->
  <section id="recPanel" class="sheet rec-panel" hidden aria-live="polite">
    <div class="rec-head">
      <svg class="ic rec-kind-ic"><use id="recKindIcon" href="#i-polygon"/></svg>
      <div class="rec-title"><strong id="recTitle"></strong><span id="recHint" class="muted"></span></div>
      <span id="recDot" class="rec-dot" hidden></span>
    </div>
    <div class="rec-stats">
      <div><span class="stat-label" data-i18n="rec.vertices"></span><strong id="stVertices">0</strong></div>
      <div id="stAreaBox"><span class="stat-label" data-i18n="rec.area"></span><strong id="stArea">—</strong></div>
      <div><span class="stat-label" id="stLenLabel" data-i18n="rec.perimeter"></span><strong id="stLen">—</strong></div>
      <div><span class="stat-label" data-i18n="rec.accuracy"></span><strong id="stAcc">—</strong></div>
    </div>
    <div id="recProgress" class="rec-progress" hidden><div id="recProgressBar"></div><span id="recProgressText"></span></div>
    <p id="recWarn" class="rec-warn" hidden></p>
    <div class="rec-buttons">
      <button id="btnRecMark" class="btn-primary" type="button" hidden><svg class="ic"><use href="#i-corner"/></svg><span id="btnRecMarkText"></span></button>
      <button id="btnRecPause" class="btn-secondary" type="button" hidden><svg class="ic"><use id="recPauseIcon" href="#i-pause"/></svg><span id="btnRecPauseText"></span></button>
      <button id="btnRecUndo" class="btn-secondary" type="button"><svg class="ic"><use href="#i-undo"/></svg><span data-i18n="rec.undo"></span></button>
      <button id="btnRecFinish" class="btn-primary" type="button"><svg class="ic"><use href="#i-check"/></svg><span id="btnRecFinishText" data-i18n="rec.finish"></span></button>
      <button id="btnRecCancel" class="btn-text danger" type="button" data-i18n="rec.cancel"></button>
    </div>
  </section>

  <!-- Escolher o que registar -->
  <section id="newSheet" class="sheet" hidden>
    <div class="sheet-head"><h2 id="newSheetTitle" data-i18n="new.title"></h2><button class="icon-btn" data-close type="button" aria-label="×"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div id="newKinds" class="choice-grid">
      <button type="button" class="choice" data-kind="polygon"><svg class="ic"><use href="#i-polygon"/></svg><strong data-i18n="kind.polygon"></strong><span data-i18n="kind.polygon.d"></span></button>
      <button type="button" class="choice" data-kind="line"><svg class="ic"><use href="#i-line"/></svg><strong data-i18n="kind.line"></strong><span data-i18n="kind.line.d"></span></button>
      <button type="button" class="choice" data-kind="point"><svg class="ic"><use href="#i-point"/></svg><strong data-i18n="kind.point"></strong><span data-i18n="kind.point.d"></span></button>
    </div>
    <div id="newMethods" class="choice-list" hidden></div>
  </section>

  <!-- Lista -->
  <section id="listPanel" class="sheet list-panel" hidden>
    <div class="sheet-head"><h2 data-i18n="list.title"></h2><button class="icon-btn" data-close type="button" aria-label="×"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div class="list-filters">
      <input id="listSearch" type="search" data-i18n-ph="list.search" autocomplete="off">
      <div class="seg" id="listKind" role="group">
        <button type="button" data-k="" class="on" data-i18n="list.all"></button>
        <button type="button" data-k="polygon" data-i18n="list.areas"></button>
        <button type="button" data-k="line" data-i18n="list.lines"></button>
        <button type="button" data-k="point" data-i18n="list.points"></button>
      </div>
      <div class="list-row2">
        <label class="check"><input id="listMine" type="checkbox"> <span data-i18n="list.mine"></span></label>
        <select id="listGroup"></select>
        <select id="listSort">
          <option value="new" data-i18n="list.sort.new"></option>
          <option value="name" data-i18n="list.sort.name"></option>
          <option value="area" data-i18n="list.sort.area"></option>
        </select>
      </div>
      <p id="listSummary" class="muted small"></p>
    </div>
    <ul id="listItems" class="feature-list"></ul>
  </section>

  <!-- Detalhe -->
  <section id="detailSheet" class="sheet" hidden>
    <div class="sheet-head"><h2 id="dTitle"></h2><button class="icon-btn" data-close type="button" aria-label="×"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <p id="dSub" class="muted"></p>
    <div id="dStats" class="detail-stats"></div>
    <dl id="dMeta" class="detail-meta"></dl>
    <div class="detail-actions">
      <button id="dZoom" type="button" class="btn-secondary"><svg class="ic"><use href="#i-target"/></svg><span data-i18n="d.zoom"></span></button>
      <a id="dGmaps" class="btn-secondary" target="_blank" rel="noopener"><svg class="ic"><use href="#i-gmaps"/></svg><span data-i18n="d.gmaps"></span></a>
      <button id="dShare" type="button" class="btn-secondary"><svg class="ic"><use href="#i-share"/></svg><span data-i18n="d.share"></span></button>
      <button id="dShareKml" type="button" class="btn-secondary"><svg class="ic"><use href="#i-download"/></svg><span data-i18n="d.kml"></span></button>
      <button id="dEdit" type="button" class="btn-secondary"><svg class="ic"><use href="#i-edit"/></svg><span data-i18n="d.edit"></span></button>
      <button id="dArchive" type="button" class="btn-text danger"><svg class="ic"><use href="#i-archive"/></svg><span data-i18n="d.archive"></span></button>
    </div>
  </section>
</main>

<!-- ============================== Diálogos ============================== -->
<dialog id="saveDialog" class="dlg">
  <form method="dialog" id="saveForm">
    <h2 id="saveTitle" data-i18n="save.title"></h2>
    <p id="saveSummary" class="save-summary"></p>
    <p id="saveWarn" class="rec-warn" hidden></p>
    <label><span data-i18n="save.name"></span><input id="fName" required maxlength="120" autocomplete="off"></label>
    <label><span data-i18n="save.category"></span><select id="fCategory"></select></label>
    <label><span data-i18n="save.group"></span><input id="fGroup" list="groupList" maxlength="80" autocomplete="off" data-i18n-ph="save.group.ph"></label>
    <datalist id="groupList"></datalist>
    <label><span data-i18n="save.notes"></span><textarea id="fNotes" rows="3" maxlength="2000"></textarea></label>
    <div class="dlg-buttons">
      <button type="button" id="saveCancel" class="btn-text" data-i18n="common.back"></button>
      <button type="submit" id="saveOk" class="btn-primary" data-i18n="save.ok"></button>
    </div>
  </form>
</dialog>

<dialog id="menuDialog" class="dlg menu-dlg">
  <div class="menu-user"><svg class="ic"><use href="#i-user"/></svg><div><strong id="menuName"></strong><span id="menuEmail" class="muted small"></span></div></div>
  <nav class="menu-items">
    <button type="button" data-act="list"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="menu.list"></span></button>
    <button type="button" data-act="export"><svg class="ic"><use href="#i-download"/></svg><span data-i18n="menu.export"></span></button>
    <button type="button" data-act="import"><svg class="ic"><use href="#i-upload"/></svg><span data-i18n="menu.import"></span></button>
    <button type="button" data-act="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="menu.settings"></span></button>
    <button type="button" data-act="help"><svg class="ic"><use href="#i-help"/></svg><span data-i18n="menu.help"></span></button>
    <button type="button" data-act="lang"><svg class="ic"><use href="#i-layers"/></svg><span data-i18n="menu.lang"></span></button>
    <button type="button" data-act="sync"><svg class="ic"><use href="#i-cloud-ok"/></svg><span id="menuSyncText" data-i18n="menu.sync"></span></button>
    <button type="button" data-act="signout" class="danger"><svg class="ic"><use href="#i-user"/></svg><span id="menuSignoutText" data-i18n="menu.signout"></span></button>
  </nav>
  <p class="muted small menu-version" id="menuVersion"></p>
  <div class="dlg-buttons"><button type="button" class="btn-text" data-close data-i18n="common.close"></button></div>
</dialog>

<dialog id="exportDialog" class="dlg">
  <h2 data-i18n="exp.title"></h2>
  <label><span data-i18n="exp.scope"></span>
    <select id="expScope">
      <option value="all" data-i18n="exp.scope.all"></option>
      <option value="filtered" data-i18n="exp.scope.filtered"></option>
      <option value="mine" data-i18n="exp.scope.mine"></option>
    </select>
  </label>
  <p id="expCount" class="muted small"></p>
  <div class="export-list">
    <button type="button" data-fmt="kml"><strong>KML</strong><span data-i18n="exp.kml"></span></button>
    <button type="button" data-fmt="geojson"><strong>GeoJSON</strong><span data-i18n="exp.geojson"></span></button>
    <button type="button" data-fmt="csv"><strong>CSV</strong><span data-i18n="exp.csv"></span></button>
    <button type="button" data-fmt="zip"><strong>ZIP</strong><span data-i18n="exp.zip"></span></button>
  </div>
  <div class="dlg-buttons"><button type="button" class="btn-text" data-close data-i18n="common.close"></button></div>
</dialog>

<dialog id="importDialog" class="dlg">
  <h2 data-i18n="imp.title"></h2>
  <p data-i18n="imp.lead"></p>
  <input id="impFile" type="file" accept=".kml,.kmz,.geojson,.json,application/vnd.google-earth.kml+xml,application/geo+json">
  <div id="impPreview" class="muted small"></div>
  <label><span data-i18n="save.group"></span><input id="impGroup" list="groupList" maxlength="80" autocomplete="off"></label>
  <div class="dlg-buttons">
    <button type="button" class="btn-text" data-close data-i18n="common.cancel"></button>
    <button type="button" id="impOk" class="btn-primary" disabled data-i18n="imp.ok"></button>
  </div>
</dialog>

<dialog id="settingsDialog" class="dlg">
  <h2 data-i18n="set.title"></h2>
  <label><span data-i18n="set.lang"></span>
    <select id="sLang"><option value="pt">Português</option><option value="ja">日本語</option></select></label>
  <label><span data-i18n="set.maxAcc"></span>
    <select id="sMaxAcc"><option>5</option><option>8</option><option>10</option><option>15</option><option>20</option><option>30</option></select>
    <small class="muted" data-i18n="set.maxAcc.d"></small></label>
  <label><span data-i18n="set.minDist"></span>
    <select id="sMinDist"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select>
    <small class="muted" data-i18n="set.minDist.d"></small></label>
  <label><span data-i18n="set.avg"></span>
    <select id="sAvg"><option>3</option><option>5</option><option>10</option><option>15</option><option>30</option></select>
    <small class="muted" data-i18n="set.avg.d"></small></label>
  <label><span data-i18n="set.mapMode"></span>
    <select id="sMapMode">
      <option value="auto" data-i18n="set.mapMode.auto"></option>
      <option value="google" data-i18n="set.mapMode.google"></option>
      <option value="simple" data-i18n="set.mapMode.simple"></option>
    </select></label>
  <label><span data-i18n="set.mapType"></span>
    <select id="sMapType">
      <option value="hybrid" data-i18n="set.mapType.hybrid"></option>
      <option value="satellite" data-i18n="set.mapType.satellite"></option>
      <option value="roadmap" data-i18n="set.mapType.roadmap"></option>
      <option value="terrain" data-i18n="set.mapType.terrain"></option>
    </select></label>
  <div class="dlg-buttons">
    <button type="button" class="btn-text" data-close data-i18n="common.cancel"></button>
    <button type="button" id="sOk" class="btn-primary" data-i18n="common.save"></button>
  </div>
</dialog>

<dialog id="helpDialog" class="dlg help-dlg">
  <div id="helpBody"></div>
  <div class="dlg-buttons"><button type="button" class="btn-primary" data-close data-i18n="common.close"></button></div>
</dialog>

<dialog id="confirmDialog" class="dlg">
  <p id="confirmText"></p>
  <div class="dlg-buttons">
    <button type="button" id="confirmNo" class="btn-text"></button>
    <button type="button" id="confirmYes" class="btn-primary"></button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<div id="bootError" class="screen" hidden>
  <div class="screen-card">
    <h1 data-i18n="boot.title"></h1>
    <p id="bootErrorText"></p>
    <button type="button" class="btn-primary btn-wide" onclick="location.reload()" data-i18n="boot.retry"></button>
    <button type="button" id="btnDemo2" class="btn-text btn-wide" data-i18n="login.demo"></button>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>
  // Atualização automática: quando um novo sw.js toma conta, recarrega uma vez.
  // Não recarrega durante uma gravação (o app.js marca window.__fgmRecording).
  if ('serviceWorker' in navigator) {
    let reloaded = false;
    // Na primeira visita não havia controlador: a troca é só a instalação, não uma atualização.
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded || window.__fgmRecording) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
