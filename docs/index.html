<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="description" content="Registo GPS de campos, linhas e pontos — funciona sem rede e partilha com a equipa.">
<title>Field GPS Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>

<!-- アイコン(自前の SVG。絵文字は端末ごとに大きさ・見た目が変わるので使わない) -->
<svg id="iconDefs" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chart" viewBox="0 0 24 24"><path fill="currentColor" d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path fill="currentColor" d="M5 11h14v2H5z"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path fill="currentColor" d="M12 16.5 4.6 10.8 3 12l9 7 9-7-1.6-1.2zM12 14l9-7-9-7-9 7z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></symbol>
  <symbol id="i-polygon" viewBox="0 0 24 24"><path fill="currentColor" d="M5 4h5l9 3v9l-6 4H6l-3-8zm1.4 2L5 12.2 7.3 18h5.1l4.6-3V8.4L9.7 6z"/><circle cx="5" cy="4" r="2" fill="currentColor"/><circle cx="19" cy="7" r="2" fill="currentColor"/><circle cx="13" cy="20" r="2" fill="currentColor"/><circle cx="3" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M3 19c3-1 4-6 8-7s5-6 10-8"/><circle cx="3" cy="19" r="2" fill="currentColor"/><circle cx="21" cy="4" r="2" fill="currentColor"/></symbol>
  <symbol id="i-point" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2a5.1 5.1 0 0 1-4.4-2.4l-1-1.6a2 2 0 0 0-2.5-.8L6 8.3V13h2V9.6z"/></symbol>
  <symbol id="i-corner" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M4 20V5h15"/><circle cx="4" cy="5" r="3" fill="currentColor"/></symbol>
  <symbol id="i-tap" viewBox="0 0 24 24"><path fill="currentColor" d="M9 11.2V7.5a1.5 1.5 0 0 1 3 0v6.1l3.6 1a2 2 0 0 1 1.4 2.3L16 22H8.5l-3.7-5.3a1.3 1.3 0 0 1 2-1.6L9 17zM10.5 2a5.5 5.5 0 0 1 4.4 8.8l-1.2-.9A4 4 0 1 0 7 7.5c0 .9.3 1.7.8 2.4l-1.2.9A5.5 5.5 0 0 1 10.5 2z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path fill="currentColor" d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM4 18h16v2H4z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path fill="currentColor" d="M11 16h2V6.8l3.3 3.3 1.4-1.4L12 3 6.3 8.7l1.4 1.4L11 6.8zM4 18h16v2H4z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.3-2.9a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-3.3 0-9 1.7-9 5v2h18v-2c0-3.3-5.7-5-9-5z"/></symbol>
  <symbol id="i-cloud-ok" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 10A7 7 0 0 0 6.3 8 5.5 5.5 0 0 0 6.5 19h12.7a4.5 4.5 0 0 0 .2-9zM10 17l-3.5-3.5 1.4-1.4 2.1 2.1 5.1-5.1 1.4 1.4z"/></symbol>
  <symbol id="i-cloud-off" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 10A7 7 0 0 0 9.1 4.6l1.5 1.5A5 5 0 0 1 17.5 11v.5H19a2.5 2.5 0 0 1 1.7 4.3l1.4 1.5A4.5 4.5 0 0 0 19.4 10zM3 5.3 5.8 8A5.5 5.5 0 0 0 6.5 19h11.2l2 2 1.3-1.3L4.3 4zM7.7 10l7 7H6.5a3.5 3.5 0 0 1 0-7z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 8c-2.7 0-5.1 1-7 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.1 16l2.3-.8A10.5 10.5 0 0 0 12.5 8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.3V21h3.8L17.8 9.9l-3.7-3.7zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7z"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 5.2 19.1 3.5A1.5 1.5 0 0 0 18 3H6a1.5 1.5 0 0 0-1.2.5L3.5 5.2A2 2 0 0 0 3 6.5V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.5a2 2 0 0 0-.5-1.3zM12 17.5 6.5 12H10v-2h4v2h3.5zM5.1 5l.8-1h12l.9 1z"/></symbol>
  <symbol id="i-gmaps" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 3 15 5.1 9 3 3.5 4.9A.5.5 0 0 0 3 5.4V20.5a.5.5 0 0 0 .7.5L9 18.9l6 2.1 5.5-1.9a.5.5 0 0 0 .5-.5V3.5a.5.5 0 0 0-.5-.5zM15 19l-6-2.1V5l6 2.1z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path fill="currentColor" d="M9.4 4 7.6 6H4.5A2.5 2.5 0 0 0 2 8.5v10A2.5 2.5 0 0 0 4.5 21h15a2.5 2.5 0 0 0 2.5-2.5v-10A2.5 2.5 0 0 0 19.5 6h-3.1l-1.8-2zM12 17.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-2a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path fill="currentColor" d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="currentColor" d="M17.7 6.3A8 8 0 1 0 19.7 14h-2.1a6 6 0 1 1-1.4-6.2L13 11h7V4z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8.1 8zM12 20c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4z"/></symbol>
  <symbol id="i-offline" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 3 6v6c0 5.3 3.8 9.7 9 10.9 5.2-1.2 9-5.6 9-10.9V6zm-1.5 14.5-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4z"/></symbol>
</svg>

<!-- ============================== 入口の画面 ============================== -->
<section id="loginScreen" class="screen" hidden>
  <div class="screen-card fade-up">
    <img src="icon-192.png" alt="" class="app-logo" width="76" height="76">
    <h1>Field GPS Map</h1>
    <p class="lead" data-i18n="login.lead"></p>
    <ul class="login-points">
      <li><svg class="ic"><use href="#i-offline"/></svg><span data-i18n="login.p1"></span></li>
      <li><svg class="ic"><use href="#i-corner"/></svg><span data-i18n="login.p2"></span></li>
      <li><svg class="ic"><use href="#i-camera"/></svg><span data-i18n="login.p3"></span></li>
    </ul>
    <p id="loginStatus" class="muted small" aria-live="polite"></p>
    <button id="btnSignIn" class="btn-primary btn-wide tappable" type="button" data-i18n="login.google"></button>
    <button id="btnDemo" class="btn-ghost btn-wide tappable" type="button" data-i18n="login.demo"></button>
    <div class="lang-switch" role="group" aria-label="Língua / Language / 言語">
      <button type="button" data-lang="pt">Português</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ja">日本語</button>
    </div>
  </div>
</section>

<section id="deniedScreen" class="screen" hidden>
  <div class="screen-card fade-up">
    <h1 data-i18n="denied.title"></h1>
    <p id="deniedText"></p>
    <p class="muted" data-i18n="denied.how"></p>
    <button id="btnRecheck" class="btn-primary btn-wide tappable" type="button" data-i18n="denied.recheck"></button>
    <button id="btnSignOutDenied" class="btn-ghost btn-wide tappable" type="button" data-i18n="menu.signout"></button>
  </div>
</section>

<!-- ============================== メインの画面 ============================== -->
<main id="mainScreen" hidden>
  <div id="mapGoogle" class="map-layer"></div>
  <div id="mapSimple" class="map-layer" hidden><canvas id="simpleCanvas"></canvas></div>

  <header class="topbar">
    <button id="btnMenu" class="glass-btn icon-only tappable" type="button" data-i18n-title="menu.open"><svg class="ic"><use href="#i-menu"/></svg><span id="updDot" class="upd-dot" hidden></span></button>
    <button id="btnList" class="glass-btn tappable" type="button"><svg class="ic"><use href="#i-list"/></svg><span id="listCount">0</span></button>
    <span class="spacer"></span>
    <button id="gpsChip" class="glass-btn chip gps-wait tappable" type="button"><span class="dot"></span><span id="gpsText">GPS…</span></button>
    <button id="syncChip" class="glass-btn chip tappable" type="button" hidden><svg class="ic"><use id="syncIcon" href="#i-cloud-ok"/></svg><span id="syncText"></span></button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="map-tools">
    <button id="btnLayers" class="round-btn tappable" type="button" data-i18n-title="map.layers"><svg class="ic"><use href="#i-layers"/></svg></button>
    <button id="btnZoomIn" class="round-btn tappable" type="button" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button id="btnZoomOut" class="round-btn tappable" type="button" aria-label="-"><svg class="ic"><use href="#i-minus"/></svg></button>
    <button id="btnLocate" class="round-btn tappable" type="button" data-i18n-title="map.locate"><svg class="ic"><use href="#i-locate"/></svg></button>
  </div>

  <div id="mapModeTag" class="map-mode-tag" hidden></div>

  <button id="fabNew" class="fab tappable" type="button"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="new.button"></span></button>

  <!-- 記録中のパネル -->
  <section id="recPanel" class="sheet rec-panel" hidden aria-live="polite">
    <div class="grabber"></div>
    <div class="rec-head">
      <span class="kind-badge"><svg class="ic"><use id="recKindIcon" href="#i-polygon"/></svg></span>
      <div class="rec-title"><strong id="recTitle"></strong><span id="recHint"></span></div>
      <button id="btnRecCancel" class="icon-btn tappable" type="button" data-i18n-title="rec.cancel"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="seg" id="recMode" role="group">
      <button type="button" data-mode="gps" class="tappable"><svg class="ic"><use href="#i-walk"/></svg><span data-i18n="rec.mode.gps"></span></button>
      <button type="button" data-mode="tap" class="tappable"><svg class="ic"><use href="#i-tap"/></svg><span data-i18n="rec.mode.tap"></span></button>
    </div>
    <div class="rec-stats">
      <div class="stat-main"><span class="stat-label" data-i18n="rec.vertices"></span><strong id="stVertices">0</strong><small id="stGoal" class="muted"></small></div>
      <div id="stAreaBox"><span class="stat-label" data-i18n="rec.area"></span><strong id="stArea">—</strong></div>
      <div><span class="stat-label" id="stLenLabel" data-i18n="rec.perimeter"></span><strong id="stLen">—</strong></div>
      <div><span class="stat-label" data-i18n="rec.accuracy"></span><strong id="stAcc">—</strong></div>
    </div>
    <p id="recWarn" class="rec-warn" hidden></p>
    <button id="btnRecMark" class="btn-mark tappable" type="button" hidden><svg class="ic"><use id="recMarkIcon" href="#i-corner"/></svg><span id="btnRecMarkText"></span></button>
    <div class="rec-buttons">
      <button id="btnRecUndo" class="btn-secondary tappable" type="button"><svg class="ic"><use href="#i-undo"/></svg><span data-i18n="rec.undo"></span></button>
      <button id="btnRecFinish" class="btn-dark tappable" type="button"><svg class="ic"><use href="#i-check"/></svg><span id="btnRecFinishText" data-i18n="rec.finish"></span></button>
    </div>
  </section>

  <!-- 何を記録するか -->
  <section id="newSheet" class="sheet" hidden>
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="newSheetTitle" data-i18n="new.title"></h2><button class="icon-btn tappable" data-close type="button" aria-label="×"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div id="newKinds" class="choice-grid">
      <button type="button" class="choice tappable" data-kind="polygon"><span class="choice-ic"><svg class="ic"><use href="#i-polygon"/></svg></span><strong data-i18n="kind.polygon"></strong><span data-i18n="kind.polygon.d"></span></button>
      <button type="button" class="choice tappable" data-kind="line"><span class="choice-ic"><svg class="ic"><use href="#i-line"/></svg></span><strong data-i18n="kind.line"></strong><span data-i18n="kind.line.d"></span></button>
      <button type="button" class="choice tappable" data-kind="point"><span class="choice-ic"><svg class="ic"><use href="#i-point"/></svg></span><strong data-i18n="kind.point"></strong><span data-i18n="kind.point.d"></span></button>
    </div>
  </section>

  <!-- 一覧 -->
  <section id="listPanel" class="sheet list-panel" hidden>
    <div class="grabber"></div>
    <div class="sheet-head"><h2 data-i18n="list.title"></h2><button class="icon-btn tappable" data-close type="button" aria-label="×"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div class="list-filters">
      <input id="listSearch" type="search" data-i18n-ph="list.search" autocomplete="off">
      <div class="chips scroll" id="listGroups" role="group"></div>
      <p id="listSummary" class="list-summary"></p>
    </div>
    <ul id="listItems" class="feature-list"></ul>
  </section>

  <!-- 詳細 -->
  <section id="detailSheet" class="sheet detail-sheet" hidden>
    <div class="grabber"></div>
    <div class="sheet-head"><div class="detail-title"><h2 id="dTitle"></h2><p id="dSub" class="muted small"></p></div><button class="icon-btn tappable" data-close type="button" aria-label="×"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div id="dStats" class="detail-stats"></div>
    <div class="photo-strip" id="dPhotos"></div>
    <div class="action-row">
      <a id="dGmaps" class="action tappable" target="_blank" rel="noopener"><span><svg class="ic"><use href="#i-gmaps"/></svg></span><small data-i18n="d.gmaps"></small></a>
      <button id="dShare" type="button" class="action tappable"><span><svg class="ic"><use href="#i-share"/></svg></span><small data-i18n="d.share"></small></button>
      <button id="dShareKml" type="button" class="action tappable"><span><svg class="ic"><use href="#i-download"/></svg></span><small data-i18n="d.kml"></small></button>
      <button id="dEdit" type="button" class="action tappable"><span><svg class="ic"><use href="#i-edit"/></svg></span><small data-i18n="d.edit"></small></button>
    </div>
    <dl id="dMeta" class="detail-meta"></dl>
    <button id="dArchive" type="button" class="btn-ghost danger btn-wide tappable"><svg class="ic"><use href="#i-archive"/></svg><span data-i18n="d.archive"></span></button>
  </section>
</main>

<!-- 写真を選ぶ(カメラかギャラリー。端末が選ばせてくれる) -->
<input id="photoInput" type="file" accept="image/*" multiple hidden>

<!-- ============================== ダイアログ ============================== -->
<dialog id="saveDialog" class="dlg">
  <form method="dialog" id="saveForm">
    <h2 id="saveTitle" data-i18n="save.title"></h2>
    <p id="saveSummary" class="save-summary"></p>
    <p id="saveWarn" class="rec-warn" hidden></p>
    <label><span data-i18n="save.name"></span><input id="fName" required maxlength="120" autocomplete="off"></label>
    <div class="field"><span class="field-label" data-i18n="save.category"></span><div id="fCatChips" class="chips wrap"></div></div>
    <label><span data-i18n="save.group"></span><input id="fGroup" list="groupList" maxlength="80" autocomplete="off" data-i18n-ph="save.group.ph"></label>
    <datalist id="groupList"></datalist>
    <div class="field" id="savePhotosBox"><span class="field-label" data-i18n="save.photos"></span><div id="savePhotos" class="photo-grid"></div></div>
    <label><span data-i18n="save.notes"></span><textarea id="fNotes" rows="2" maxlength="2000"></textarea></label>
    <div class="dlg-buttons">
      <button type="button" id="saveCancel" class="btn-ghost tappable" data-i18n="common.back"></button>
      <button type="submit" id="saveOk" class="btn-primary tappable" data-i18n="save.ok"></button>
    </div>
  </form>
</dialog>

<dialog id="viewerDialog" class="viewer">
  <img id="viewerImg" alt="">
  <button type="button" id="viewerPrev" class="viewer-nav prev" aria-label="&lt;"><svg class="ic"><use href="#i-left"/></svg></button>

<script type="module" src="app.js"></script>
<script>
  // 自動更新(jatlog_offline と同じ考え方):
  //   新しい sw.js は skipWaiting() で即座に有効になり、controllerchange で1回だけ再読み込みする。
  //   ただし記録の途中(app.js が window.__fgmRecording を立てる)は再読み込みしない。
  //   そのときは window.__fgmUpdatePending を立てておき、記録が終わった時点で app.js が再読み込みする。
  //   初回の訪問(それまで制御する SW が無かった)の controllerchange は「導入」なので再読み込みしない。
  if ('serviceWorker' in navigator) {
    let reloaded = false;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      if (window.__fgmRecording) {
        window.__fgmUpdatePending = true;
        window.dispatchEvent(new Event('fgm-update-deferred'));
        return;
      }
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
